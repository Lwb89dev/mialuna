name: mialuna
description: "Mialuna — Your moments, under the same moon. A visual social network powered by Nostr."
publish_to: 'none'
version: 0.15.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  web_socket_channel: ^3.0.3
  crypto: ^3.0.6
  bip340: ^0.3.1
  http: ^1.5.0
  image_picker: ^1.2.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  video_player: ^2.14.1
  url_launcher: ^6.3.3
  pointycastle: ^4.0.0
  image: ^4.12.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#20243D"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
